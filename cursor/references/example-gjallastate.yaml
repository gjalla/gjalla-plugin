# .gjallastate.yaml — Declarative architecture state
#
# This file declares what the system is: its architecture elements,
# connections, data model, capabilities, rules, tech stack, API surface,
# external services, and data flows. Each entry carries facts —
# declarative assertions about behavior and design.
#
# Generated by gjalla's analysis pipeline, then maintained incrementally.
# Sorted keys for clean git diffs. Slug-keyed throughout.

metadata:
  version: "2.0"
  lineage: project-example
  commit_sha: a1b2c3d4
  captured_at: "2026-03-01T00:00:00Z"

# ── Architecture Elements ────────────────────────────────────────────────────
# System containers, components, and external systems (C4 model).

architecture:
  elements:
    api-server:
      type: container
      category: Backend
      description: Express.js API server handling all REST endpoints
      facts:
        - Handles authentication via Clerk middleware
        - Uses Drizzle ORM for database access
        - Runs on port 3001 in development
      status: implemented
      parent: null

    payment-service:
      type: component
      category: Backend
      description: Processes payments and refunds via Stripe
      facts:
        - Handles PCI-scoped data
        - Stateless — no local payment state
      status: implemented
      parent: api-server

    web-app:
      type: container
      category: Frontend
      description: React SPA served via Vite
      facts:
        - Uses TanStack Query for server state
        - Route-based code splitting
      status: implemented
      parent: null

  connections:
    api-server-to-postgres:
      source: api-server
      target: postgres
      type: sync
      protocol: TCP/PostgreSQL
      description: Primary data store
      facts:
        - Connection pooling via pg-pool
        - All queries go through Drizzle ORM

    web-app-to-api-server:
      source: web-app
      target: api-server
      type: sync
      protocol: REST/HTTPS
      description: All data fetching and mutations
      facts:
        - JSON request/response format
        - Bearer token auth on every request

    payment-service-to-stripe:
      source: payment-service
      target: stripe
      type: sync
      protocol: REST/HTTPS
      description: Payment processing and refund requests
      facts:
        - Uses idempotency keys for all mutations

# ── Data Model ───────────────────────────────────────────────────────────────
# Domain entities with attributes and relationships.

data_entities:
  order:
    description: Customer purchase record
    domain: commerce
    facts:
      - Status follows draft -> pending -> confirmed -> fulfilled lifecycle
      - Soft-deleted, never hard-deleted

  customer:
    description: Registered user with billing info
    domain: identity
    facts:
      - Email is the unique identifier
      - Synced from Clerk on first login

# ── Data Flows ───────────────────────────────────────────────────────────────
# End-to-end data movement paths through the system.

data_flows:
  payment-charge-flow:
    description: Customer payment from web app through API to Stripe
    facts:
      - Starts at web-app, routes through api-server to payment-service
      - Stripe webhook confirms settlement asynchronously

# ── Capabilities ─────────────────────────────────────────────────────────────
# What the system can do, with acceptance criteria.

capabilities:
  payment-processing:
    description: Accept and process customer payments
    status: active
    acceptance_criteria:
      - Supports credit card and ACH payments
      - Generates receipts on successful charge
      - Handles refunds within 30-day window

  order-management:
    description: Create, track, and fulfill customer orders
    status: active
    acceptance_criteria:
      - Orders follow defined lifecycle states
      - Email notifications on status changes

# ── Rules ────────────────────────────────────────────────────────────────────
# Principles, ADRs, and constraints the system must adhere to.

rules:
  no-direct-db-from-api:
    type: principle
    description: API handlers must go through the service layer for DB access
    status: active
    facts:
      - Enforced by code review and architecture checks

  use-idempotency-keys:
    type: adr
    description: All Stripe mutations use idempotency keys
    status: accepted
    facts:
      - Prevents duplicate charges on network retries

# ── Tech Stack ───────────────────────────────────────────────────────────────

tech_stack:
  express:
    type: framework
    vendor: OpenJS Foundation

  react:
    type: framework
    vendor: Meta

  drizzle:
    type: orm
    vendor: Drizzle Team

# ── Surface Area ─────────────────────────────────────────────────────────────
# External contracts (REST, gRPC, WebSocket, etc.)

surface_area:
  post-api-payments-charge:
    type: api_endpoint
    summary: Initiate a payment charge
    auth_required: true

  get-api-orders:
    type: api_endpoint
    summary: List orders for authenticated user
    auth_required: true

# ── External Services ────────────────────────────────────────────────────────

external_services:
  stripe:
    description: Payment processing provider
    service_type: infrastructure
    facts:
      - Used for card payments, ACH, and refunds
      - Webhook events for async payment status updates

  neon:
    description: Serverless PostgreSQL provider
    service_type: infrastructure
    facts:
      - Auto-scales to zero
      - Branching for preview environments
